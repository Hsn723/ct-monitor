version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    allow:
      - dependency-type: "all"
    groups:
      go-smtp:
        patterns:
          - "^github.com/emersion/.*"
      k8s:
        patterns:
          - "^k8s.io/*"
          - "^sigs.k8s.io/*"
      ginkgo:
        patterns:
          - "^github.com/onsi/*"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "^github.com/emersion/.*"
          - "^k8s.io/*"
          - "^sigs.k8s.io/*"
          - "^github.com/onsi/*"
          - "^github.com/gruntwork-io/*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
      exclude:
        - "hsn723/actions"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
